<text x="58" y="78" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#b86628">TRAVEL PLANNING, WITHOUT THE SPREADSHEET</text>
<text x="58" y="178" font-family="Georgia,serif" font-size="72" font-weight="400" letter-spacing="-3.2">Plan a trip that</text>
