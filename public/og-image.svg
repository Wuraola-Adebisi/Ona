<text x="58" y="300" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5d6573">Tell Ona where you are going and what you want from the trip.</text>
<text x="58" y="331" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5d6573">It turns that into a day-by-day plan you can actually use.</text>
